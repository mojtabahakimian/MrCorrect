name: WPF Cloud Validation & E2E GUI Test CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-gui-e2e-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore MrCorrect.sln

    - name: Build Solution (Debug)
      run: dotnet build MrCorrect.sln --configuration Debug --no-restore

    - name: Run FlaUI Automated WPF GUI E2E Test
      run: |
        dotnet test MrCorrect.E2ETests/MrCorrect.E2ETests.csproj --configuration Debug --no-build --logger "trx;LogFileName=e2e-test-results.trx"

    - name: Upload Test Results & Screenshots Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WPF-E2E-Test-Artifacts
        path: |
          MrCorrect.E2ETests/TestResults/
          MrCorrect.E2ETests/bin/Debug/net8.0-windows7.0/TestArtifacts/

    - name: Upload Build Package Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MrCorrect-WPF-Package
        path: |
          Prg_UI/bin/Debug/net8.0-windows7.0/win-x64/
